name: .al7e7e7roud.

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 🔐 Ativar RDP e Firewall
        shell: powershell
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" UserAuthentication 0
          netsh advfirewall firewall add rule name="Permitir RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: 👤 Criar usuário RDP
        shell: powershell
        run: |
          $u = "${{ secrets.RDP_USERNAME }}"
          $p = "${{ secrets.RDP_PASSWORD }}"
          $sp = ConvertTo-SecureString $p -AsPlainText -Force

          if (Get-LocalUser -Name $u -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $u -Password $sp
          } else {
            New-LocalUser -Name $u -Password $sp -AccountNeverExpires
          }

          Add-LocalGroupMember Administrators $u
          Add-LocalGroupMember "Remote Desktop Users" $u

      - name: ⚡ Otimizações de performance
        shell: powershell
        run: |
          powercfg -setactive SCHEME_MIN

          New-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Force
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" SystemResponsiveness 0

          New-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Force
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "GPU Priority" 8
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "Priority" 6
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "Scheduling Category" "High"

      - name: 🎮 GPU Virtual
        shell: powershell
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Terminal Server\TSAppCompat" /v EnableGpuHardwareAcceleration /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableGpuRemoteFX /t REG_DWORD /d 1 /f

      - name: 📦 Instalar WinRAR
        shell: powershell
        run: |
          curl.exe -L https://www.win-rar.com/fileadmin/winrar-versions/winrar/winrar-x64-624.exe -o "$env:TEMP\winrar.exe"
          Start-Process "$env:TEMP\winrar.exe" -ArgumentList "/S" -Wait

      - name: 🌐 Instalar Tailscale
        shell: powershell
        run: |
          curl.exe -L https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -o "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait

      - name: 🔗 Conectar Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=PR-Cloud

      - name: 🎮 Instalar Steam
        shell: powershell
        run: |
          curl.exe -L https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe -o "$env:TEMP\steam.exe"
          Start-Process "$env:TEMP\steam.exe" -ArgumentList "/S" -Wait

      - name: ☀️ Instalar Sunshine
        shell: powershell
        run: |
          curl.exe -L https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.exe -o "$env:TEMP\sunshine.exe"
          Start-Process "$env:TEMP\sunshine.exe" -ArgumentList "/S" -Wait

      - name: 🎮 Baixar Garry's Mod
        shell: powershell
        run: |
          $url="https://www.mediafire.com/file/7ymehk6r5a7my44/Garry%2527s_Mod_Optimized.7z/file"
          $file="$env:TEMP\gmod.7z"
          $folder="$env:USERPROFILE\Desktop\GMod"

          curl.exe -L $url -o $file

          New-Item -ItemType Directory -Force -Path $folder

          & "C:\Program Files\WinRAR\WinRAR.exe" x $file $folder\ -y

      - name: 🔗 Criar Atalho GMod
        shell: powershell
        run: |
          $target="$env:USERPROFILE\Desktop\GMod\gmod.exe"
          $shortcut="$env:USERPROFILE\Desktop\GarrysMod.lnk"

          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut($shortcut)
          $sc.TargetPath = $target
          $sc.WorkingDirectory = "$env:USERPROFILE\Desktop\GMod"
          $sc.Save()

      - name: 🎨 Interface Windows 10
        shell: powershell
        run: |
          New-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" AppsUseLightTheme 1
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" SystemUsesLightTheme 1

      - name: ⏳ Manter VM ligada
        shell: powershell
        run: |
          while ($true) { Start-Sleep 300 }
