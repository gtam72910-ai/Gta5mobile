name: .apizzaloud.

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 🔐 Ativar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Ativando Área de Trabalho Remota..."
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" UserAuthentication 0
          netsh advfirewall firewall add rule name="Permitir RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: 👤 Criar usuário RDP
        shell: powershell
        run: |
          $u = "${{ secrets.RDP_USERNAME }}"
          $p = "${{ secrets.RDP_PASSWORD }}"
          $sp = ConvertTo-SecureString $p -AsPlainText -Force

          if (Get-LocalUser -Name $u -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $u -Password $sp
          } else {
            New-LocalUser -Name $u -Password $sp -AccountNeverExpires
          }

          Add-LocalGroupMember Administrators $u
          Add-LocalGroupMember "Remote Desktop Users" $u

      - name: ⚡ Otimização de desempenho
        shell: powershell
        run: |
          powercfg -setactive SCHEME_MIN

          New-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Force | Out-Null
          Set-ItemProperty `
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" `
            SystemResponsiveness 0

      - name: 🎮 Instalar ViGEmBus
        shell: powershell
        run: |
          bcdedit /set testsigning on

          $dest = "$env:TEMP\ViGEmBus.msi"
          curl.exe -L https://github.com/ViGEm/ViGEmBus/releases/latest/download/ViGEmBus_Setup_x64.msi -o "$dest"

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$dest`" /quiet /norestart" `
            -Wait

      - name: 📦 Instalar 7-Zip
        shell: powershell
        run: |
          curl.exe -L https://www.7-zip.org/a/7z2301-x64.exe -o "$env:TEMP\7zip.exe"
          Start-Process "$env:TEMP\7zip.exe" -ArgumentList "/S" -Wait

      - name: 🌐 Instalar Tailscale
        shell: powershell
        run: |
          curl.exe -L https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -o "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait

      - name: 🔗 Conectar ao Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=PR-Cloud

      - name: 📥 Baixar Pizza Tower
        shell: powershell
        run: |
          $gameZip = "$env:USERPROFILE\pizza.7z"

          Invoke-WebRequest `
          "https://www.mediafire.com/file/tp60hkcdlfglhvu/Pizza_Tower_Opti.7z/file" `
          -OutFile $gameZip

      - name: 📂 Extrair jogo
        shell: powershell
        run: |
          $zip="$env:USERPROFILE\pizza.7z"
          $dest="$env:USERPROFILE\PizzaTower"

          mkdir $dest -Force
          & "C:\Program Files\7-Zip\7z.exe" x $zip "-o$dest" -y

      - name: 🚀 Abrir Pizza Tower automaticamente
        shell: powershell
        run: |
          $exe = Get-ChildItem "$env:USERPROFILE\PizzaTower" -Recurse -Filter *.exe | Select-Object -First 1
          Start-Process $exe.FullName

      - name: ⏳ Manter VM ligada
        shell: powershell
        run: |
          while ($true) { Start-Sleep 300 }
