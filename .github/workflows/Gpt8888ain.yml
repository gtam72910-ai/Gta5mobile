name: .GPT PC CLOUD.

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          netsh advfirewall firewall add rule name="AllowRDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create fixed RDP user
        shell: powershell
        run: |
          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" >> $env:GITHUB_ENV

      - name: Setup Dark Mode + Wallpaper
        shell: powershell
        run: |
          $script = "C:\apply-theme.ps1"

          @'
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "AppsUseLightTheme" -Type DWord -Value 0
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "SystemUsesLightTheme" -Type DWord -Value 0

          $wallpaperUrl = "https://i.imgur.com/CK0Mh6y.jpeg"
          $wallpaperPath = "$env:USERPROFILE\wallpaper.jpg"
          Invoke-WebRequest $wallpaperUrl -OutFile $wallpaperPath

          reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "$wallpaperPath" /f
          reg add "HKCU\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "10" /f
          reg add "HKCU\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d "0" /f

          RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters
          '@ | Out-File -Encoding UTF8 $script

          schtasks /create `
            /tn "ApplyThemeOnce" `
            /tr "powershell -ExecutionPolicy Bypass -File $script" `
            /sc ONLOGON `
            /ru "${{ secrets.RDP_USERNAME }}" `
            /rl HIGHEST `
            /f

      # 🔥 CORREÇÃO DO GAMEPAD / MS GAME BAR
      - name: Fix Gamepad + Xbox Game Bar
        shell: powershell
        run: |
          Write-Host "Fixing Xbox Game Bar and Gamepad support..."

          $packages = @(
            "Microsoft.XboxGamingOverlay",
            "Microsoft.XboxIdentityProvider",
            "Microsoft.XboxApp",
            "Microsoft.Xbox.TCUI"
          )

          foreach ($pkg in $packages) {
            Get-AppxPackage -AllUsers $pkg | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          }

          Start-Sleep 5

          foreach ($pkg in $packages) {
            winget install --id $pkg --source msstore `
              --accept-package-agreements `
              --accept-source-agreements
          }

          Write-Host "Xbox Game Bar installed. ms-gamebar should work now."

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait

      - name: Connect to Tailscale (PR-Cloud)
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=PR-Cloud

          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { break }
            Start-Sleep 3
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Show connection info
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "DEVICE : PR-Cloud"
          Write-Host "IP     : $env:TAILSCALE_IP"
          Write-Host "USER   : $env:RDP_USER"
          Write-Host "=============================="

      - name: Keep machine alive
        shell: powershell
        run: |
          while ($true) { Start-Sleep 300 }name: .GPT PC CLOUD.

