name: .GMOD.

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: 🔐 Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 0
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: 👤 Criar usuário
        shell: powershell
        run: |
          $u = "${{ secrets.RDP_USERNAME }}"
          $p = "${{ secrets.RDP_PASSWORD }}"
          $sp = ConvertTo-SecureString $p -AsPlainText -Force

          if (Get-LocalUser -Name $u -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $u -Password $sp
          } else {
            New-LocalUser -Name $u -Password $sp -AccountNeverExpires
          }

          Add-LocalGroupMember Administrators $u
          Add-LocalGroupMember "Remote Desktop Users" $u

      - name: ⚡ Otimização de desempenho
        shell: powershell
        run: |
          powercfg -setactive SCHEME_MIN

          New-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Force | Out-Null
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" SystemResponsiveness 0

          New-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" -Force | Out-Null

          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "GPU Priority" 8
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "Priority" 6
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" "Scheduling Category" "High"

      - name: 🎮 Ativar GPU virtual (WARP)
        shell: powershell
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\DirectX" /v UseWARP /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Avalon.Graphics" /v DisableHWAcceleration /t REG_DWORD /d 0 /f

      - name: 🎮 Instalar DirectX 9
        shell: powershell
        run: |
          curl.exe -L https://download.microsoft.com/download/1/1/C/11C6D6F3-BAF4-4A8F-9F4B-2F1E1EFCBA6A/directx_Jun2010_redist.exe -o "$env:TEMP\dx9.exe"
          Start-Process "$env:TEMP\dx9.exe" -ArgumentList "/Q /T:$env:TEMP\dx9" -Wait
          Start-Process "$env:TEMP\dx9\DXSETUP.exe" -ArgumentList "/silent" -Wait

      - name: 🎮 Instalar ViGEmBus
        shell: powershell
        run: |
          bcdedit /set testsigning on
          curl.exe -L https://github.com/ViGEm/ViGEmBus/releases/latest/download/ViGEmBus_Setup_x64.msi -o "$env:TEMP\vigem.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\vigem.msi`" /quiet /norestart" -Wait

      - name: 🎮 Instalar Steam
        shell: powershell
        run: |
          curl.exe -L https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe -o "$env:TEMP\steam.exe"
          Start-Process "$env:TEMP\steam.exe" -ArgumentList "/S" -Wait

      - name: 📦 Instalar WinRAR
        shell: powershell
        run: |
          curl.exe -L https://www.win-rar.com/fileadmin/winrar-versions/winrar/winrar-x64-624.exe -o "$env:TEMP\winrar.exe"
          Start-Process "$env:TEMP\winrar.exe" -ArgumentList "/S" -Wait

      - name: 🎮 Baixar e extrair GMod
        shell: powershell
        run: |
          $folder = "C:\Games\GMod"
          New-Item -ItemType Directory -Force -Path $folder

          $file = "$folder\gmod.zip"

          curl.exe -L "https://www.mediafire.com/file/7ymehk6r5a7my44/gmod/file" -o $file

          & "C:\Program Files\WinRAR\WinRAR.exe" x -y $file $folder

      - name: 🖥️ Criar shortcut
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")
          $target = "C:\Games\GMod\gmod.exe"
          $shortcut = "$desktop\Garrys Mod.lnk"

          $wsh = New-Object -ComObject WScript.Shell
          $sc = $wsh.CreateShortcut($shortcut)
          $sc.TargetPath = $target
          $sc.WorkingDirectory = "C:\Games\GMod"
          $sc.Save()

      - name: ☀️ Instalar Sunshine
        shell: powershell
        run: |
          curl.exe -L https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.exe -o "$env:TEMP\sunshine.exe"
          Start-Process "$env:TEMP\sunshine.exe" -ArgumentList "/S" -Wait

      - name: ⏳ Manter VM ligada
        shell: powershell
        run: |
          while ($true) { Start-Sleep 300 }      - name: ⚡ Otimização de desempenho
        shell: powershell
        run: |
