          & "C:\Program Files\WinRAR\WinRAR.exe" x -y $file $folder

      - name: 🖥️ Criar Shortcut
        shell: powershell
        run: |
          $desktop=[Environment]::GetFolderPath("Desktop")
          $target="C:\Games\GMod\gmod.exe"
          $shortcut="$desktop\Garrys Mod.lnk"

          $wsh=New-Object -ComObject WScript.Shell
          $sc=$wsh.CreateShortcut($shortcut)
          $sc.TargetPath=$target
          $sc.WorkingDirectory="C:\Games\GMod"
          $sc.Save()

      - name: ☀️ Instalar Sunshine
        shell: powershell
        run: |
