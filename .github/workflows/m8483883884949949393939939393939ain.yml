name: aindows RDP + Dark Mode + Wallpaper

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ===============================
    # CRIAR / AJUSTAR USUÁRIO RDP
    # ===============================
    - name: Enable RDP and fixed user
      shell: powershell
      run: |
        $username = "${{ secrets.RDP_USER }}"
        $password = "${{ secrets.RDP_PASS }}"

        # Converter senha
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force

        # Criar usuário SOMENTE se não existir
        if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
          New-LocalUser -Name $username -Password $securePass -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
        } else {
          Write-Host "Usuário já existe, pulando criação"
        }

        # Ativar RDP
        Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # ===============================
    # DARK MODE + WALLPAPER
    # ===============================
    - name: Dark Mode + Wallpaper
      shell: powershell
      run: |
        # Forçar dark mode
        New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force | Out-Null
        Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value 0
        Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name SystemUsesLightTheme -Value 0

        # Baixar wallpaper
        $wall = "C:\wallpaper.jpg"
        Invoke-WebRequest "https://i.imgur.com/CK0Mh6y.jpeg" -OutFile $wall

        # Aplicar wallpaper
        Add-Type @"
using System.Runtime.InteropServices;
public class Wallpaper {
  [DllImport("user32.dll", SetLastError = true)]
  public static extern bool SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
}
"@
        [Wallpaper]::SystemParametersInfo(20, 0, $wall, 3)

    # ===============================
    # MANTER VM VIVA (~6h)
    # ===============================
    - name: Keep VM Alive
      shell: powershell
      run: |
        Write-Host "VM rodando por 6 horas..."
        Start-Sleep -Seconds 21600
