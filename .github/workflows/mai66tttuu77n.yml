name: PR-CLOUD

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600000

    steps:
      - name: Enable RDP and Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 0

          netsh advfirewall firewall add rule name="AllowRDP" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service TermService -Force

      - name: Create fixed RDP user
        shell: powershell
        run: |
          $username = "${{ secrets.RDP_USERNAME }}"
          $password = "${{ secrets.RDP_PASSWORD }}"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $path = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $path
          Start-Process msiexec.exe -ArgumentList "/i `"$path`" /quiet /norestart" -Wait

      - name: Connect to Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=github-rdp-$env:GITHUB_RUN_ID

          $ip = $null
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { break }
            Start-Sleep 3
          }

          if (-not $ip) {
            Write-Error "Tailscale IP not assigned"
            exit 1
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Taskbar estilo Windows 10
        shell: powershell
        run: |
          # Alinhar taskbar à esquerda
          New-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "TaskbarAl" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Remover Widgets
          New-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "TaskbarDa" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Remover Chat
          New-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "TaskbarMn" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Desativar Copilot
          New-Item -Path "HKCU:\Software\Policies\Microsoft\Windows" -Name "WindowsCopilot" -Force
          New-ItemProperty `
            -Path "HKCU:\Software\Policies\Microsoft\Windows\WindowsCopilot" `
            -Name "TurnOffWindowsCopilot" `
            -PropertyType DWord `
            -Value 1 `
            -Force

          # Reiniciar Explorer
          Stop-Process -Name explorer -Force
          Start-Process explorer

      - name: Show connection info
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "RDP READY"
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "User     : $env:RDP_USER"
          Write-Host "Password : (Secrets)"
          Write-Host "=============================="

      - name: Keep machine alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] VM running..."
            Start-Sleep 300
          }
